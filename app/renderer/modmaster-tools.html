<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ModMaster — Tool Installer</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow:hidden;}
#titlebar{position:fixed;top:0;left:0;right:0;height:40px;background:var(--bg2);border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:300;-webkit-app-region:drag;user-select:none;}
#titlebar-left{display:flex;align-items:center;gap:10px;padding:0 14px;}
#titlebar-logo{font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:linear-gradient(90deg,var(--text) 50%,var(--teal,#2dd4a0));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
#titlebar-controls{display:flex;-webkit-app-region:no-drag;}
.tb-btn{width:46px;height:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--muted);font-size:12px;transition:background 0.15s,color 0.15s;}
.tb-btn:hover{background:var(--bg3);color:var(--text);}
#tb-close:hover{background:#c42b2b;color:#fff;}
#mm-main-content{position:fixed;top:40px;left:0;right:0;bottom:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;padding:2rem;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--faint,#333845) 1px,transparent 1px),linear-gradient(90deg,var(--faint,#333845) 1px,transparent 1px);background-size:40px 40px;opacity:0.15;pointer-events:none;z-index:0;}
.card{background:var(--bg2);border:0.5px solid var(--border);border-radius:16px;padding:2.5rem 2rem;text-align:center;max-width:480px;width:100%;position:relative;z-index:1;border-top:2px solid var(--amber,#f5a623);}
.icon{font-size:3rem;margin-bottom:1rem;}
h1{font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--amber,#f5a623);margin-bottom:10px;}
p{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:1.5rem;}
.badge{display:inline-block;font-size:11px;padding:4px 12px;border-radius:99px;background:rgba(245,166,35,0.1);color:var(--amber,#f5a623);font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;margin-bottom:1.5rem;}
.back-btn{padding:10px 24px;border-radius:10px;background:rgba(245,166,35,0.1);color:var(--amber,#f5a623);border:0.5px solid rgba(245,166,35,0.3);font-family:'Rajdhani',sans-serif;font-size:0.9rem;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;}
.back-btn:hover{background:var(--amber,#f5a623);color:#0a0a0a;}
</style>
</head>
<body>
<div id="titlebar">
  <div id="titlebar-left">
    <span id="titlebar-logo">ModMaster</span>
  </div>
  <div id="titlebar-controls">
    <button class="tb-btn" onclick="window.MM?.minimize()">&#x2014;</button>
    <button class="tb-btn" onclick="window.MM?.close()">&#x2715;</button>
  </div>
</div>
<div id="mm-main-content">
  <div class="card">
    <div class="icon">🔧</div>
    <div class="badge">Coming in Step 5</div>
    <h1>Tool Installer</h1>
    <p>Install UE4SS, ScriptHookV, OpenIV and other modding tools directly into your game folder. Supports Xbox Game Pass games too. Coming in Step 5.</p>
    <button class="back-btn" onclick="window.location.href='modmaster.html'">← Back to home</button>
  </div>
</div>
<script src="electron-bridge.js"></script>
</body>
</html>
